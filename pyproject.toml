[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hospital-intelligence"
version = "0.1.0"
description = "Scalable healthcare analytics and hospital operations intelligence platform built on MIMIC-IV"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pandas>=2.2",
  "polars>=1.0",
  "duckdb>=1.0",
  "pyarrow>=15",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "dbt-core>=1.8,<1.11",
  "dbt-postgres>=1.8,<1.11",
  "scipy>=1.12",
  "streamlit>=1.35",
  "plotly>=5.20",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "tabulate>=0.9",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "playwright>=1.44"]
bigquery = ["dbt-bigquery>=1.8,<1.11", "google-cloud-bigquery>=3.20"]

[tool.setuptools.packages.find]
include = ["config*", "ingestion*", "analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires the local PostgreSQL warehouse to be loaded and built",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Markdown tables inside the report template are intentionally long lines
"analytics/reporting/executive_report.py" = ["E501"]
