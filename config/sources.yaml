# Source contract for MIMIC-IV ingestion.
#
# Column types follow the official MIMIC-IV PostgreSQL build scripts
# (github.com/MIT-LCP/mimic-code, mimic-iv/buildmimic/postgres).
# The same contract is used for the public demo (v2.2) and the
# credentialed full release (v3.1); both share these column layouts.
#
# Fields
#   file           path relative to the dataset root
#   primary_key    columns expected to be unique (checked, never enforced
#                  by deleting rows: duplicates are reported)
#   not_null       columns that must be populated; violating rows are rejected
#   parents        referential checks: {column: parent_table.column}
#   columns        ordered {name: postgres_type}
#
# Large tables in full mode are streamed in batches (HI_BATCH_ROWS).

tables:
  patients:
    file: hosp/patients.csv.gz
    primary_key: [subject_id]
    not_null: [subject_id, gender, anchor_age, anchor_year]
    columns:
      subject_id: integer
      gender: varchar(1)
      anchor_age: smallint
      anchor_year: smallint
      anchor_year_group: varchar(20)
      dod: date

  admissions:
    file: hosp/admissions.csv.gz
    primary_key: [hadm_id]
    not_null: [subject_id, hadm_id, admittime]
    parents: {subject_id: patients.subject_id}
    columns:
      subject_id: integer
      hadm_id: integer
      admittime: timestamp
      dischtime: timestamp
      deathtime: timestamp
      admission_type: varchar(40)
      admit_provider_id: varchar(10)
      admission_location: varchar(60)
      discharge_location: varchar(60)
      insurance: varchar(255)
      language: varchar(25)
      marital_status: varchar(30)
      race: varchar(80)
      edregtime: timestamp
      edouttime: timestamp
      hospital_expire_flag: smallint

  transfers:
    file: hosp/transfers.csv.gz
    primary_key: [transfer_id]
    not_null: [subject_id, transfer_id, eventtype, intime]
    parents: {subject_id: patients.subject_id, hadm_id: admissions.hadm_id}
    columns:
      subject_id: integer
      hadm_id: integer
      transfer_id: integer
      eventtype: varchar(10)
      careunit: varchar(255)
      intime: timestamp
      outtime: timestamp

  services:
    file: hosp/services.csv.gz
    primary_key: [hadm_id, transfertime, curr_service]
    not_null: [subject_id, hadm_id, transfertime, curr_service]
    parents: {hadm_id: admissions.hadm_id}
    columns:
      subject_id: integer
      hadm_id: integer
      transfertime: timestamp
      prev_service: varchar(10)
      curr_service: varchar(10)

  d_icd_diagnoses:
    file: hosp/d_icd_diagnoses.csv.gz
    primary_key: [icd_code, icd_version]
    not_null: [icd_code, icd_version]
    columns:
      icd_code: varchar(7)
      icd_version: smallint
      long_title: varchar(255)

  diagnoses_icd:
    file: hosp/diagnoses_icd.csv.gz
    primary_key: [hadm_id, seq_num]
    not_null: [subject_id, hadm_id, seq_num, icd_code, icd_version]
    parents: {hadm_id: admissions.hadm_id}
    columns:
      subject_id: integer
      hadm_id: integer
      seq_num: integer
      icd_code: varchar(7)
      icd_version: smallint

  d_icd_procedures:
    file: hosp/d_icd_procedures.csv.gz
    primary_key: [icd_code, icd_version]
    not_null: [icd_code, icd_version]
    columns:
      icd_code: varchar(7)
      icd_version: smallint
      long_title: varchar(255)

  procedures_icd:
    file: hosp/procedures_icd.csv.gz
    primary_key: [hadm_id, seq_num]
    not_null: [subject_id, hadm_id, seq_num, icd_code, icd_version]
    parents: {hadm_id: admissions.hadm_id}
    columns:
      subject_id: integer
      hadm_id: integer
      seq_num: integer
      chartdate: date
      icd_code: varchar(7)
      icd_version: smallint

  d_labitems:
    file: hosp/d_labitems.csv.gz
    primary_key: [itemid]
    not_null: [itemid]
    columns:
      itemid: integer
      label: varchar(50)
      fluid: varchar(50)
      category: varchar(50)

  labevents:
    file: hosp/labevents.csv.gz
    primary_key: [labevent_id]
    not_null: [labevent_id, subject_id, itemid, charttime]
    parents: {itemid: d_labitems.itemid, hadm_id: admissions.hadm_id}
    large: true
    columns:
      labevent_id: integer
      subject_id: integer
      hadm_id: integer
      specimen_id: integer
      itemid: integer
      order_provider_id: varchar(10)
      charttime: timestamp
      storetime: timestamp
      value: varchar(200)
      valuenum: double precision
      valueuom: varchar(20)
      ref_range_lower: double precision
      ref_range_upper: double precision
      flag: varchar(10)
      priority: varchar(7)
      comments: text

  prescriptions:
    file: hosp/prescriptions.csv.gz
    primary_key: [hadm_id, pharmacy_id, drug, starttime]
    not_null: [subject_id, hadm_id, drug]
    parents: {hadm_id: admissions.hadm_id}
    large: true
    columns:
      subject_id: integer
      hadm_id: integer
      pharmacy_id: integer
      poe_id: varchar(25)
      poe_seq: integer
      order_provider_id: varchar(10)
      starttime: timestamp
      stoptime: timestamp
      drug_type: varchar(20)
      drug: varchar(255)
      formulary_drug_cd: varchar(50)
      gsn: varchar(255)
      ndc: varchar(25)
      prod_strength: varchar(255)
      form_rx: varchar(25)
      dose_val_rx: varchar(100)
      dose_unit_rx: varchar(50)
      form_val_disp: varchar(50)
      form_unit_disp: varchar(50)
      doses_per_24_hrs: real
      route: varchar(50)

  icustays:
    file: icu/icustays.csv.gz
    primary_key: [stay_id]
    not_null: [subject_id, hadm_id, stay_id, intime]
    parents: {hadm_id: admissions.hadm_id}
    columns:
      subject_id: integer
      hadm_id: integer
      stay_id: integer
      first_careunit: varchar(255)
      last_careunit: varchar(255)
      intime: timestamp
      outtime: timestamp
      los: double precision

  d_items:
    file: icu/d_items.csv.gz
    primary_key: [itemid]
    not_null: [itemid, label]
    columns:
      itemid: integer
      label: varchar(100)
      abbreviation: varchar(50)
      linksto: varchar(30)
      category: varchar(50)
      unitname: varchar(50)
      param_type: varchar(20)
      lownormalvalue: double precision
      highnormalvalue: double precision

  chartevents:
    file: icu/chartevents.csv.gz
    # chartevents has no single-column key; (stay_id, itemid, charttime) is
    # *not* guaranteed unique in MIMIC, so duplicates are reported, not rejected.
    primary_key: [stay_id, itemid, charttime, storetime, value]
    not_null: [subject_id, stay_id, itemid, charttime]
    parents: {stay_id: icustays.stay_id, itemid: d_items.itemid}
    large: true
    optional: true
    columns:
      subject_id: integer
      hadm_id: integer
      stay_id: integer
      caregiver_id: integer
      charttime: timestamp
      storetime: timestamp
      itemid: integer
      value: varchar(200)
      valuenum: double precision
      valueuom: varchar(20)
      warning: smallint

# Load order respects parent -> child dependencies.
load_order:
  - patients
  - admissions
  - transfers
  - services
  - d_icd_diagnoses
  - diagnoses_icd
  - d_icd_procedures
  - procedures_icd
  - d_labitems
  - labevents
  - prescriptions
  - icustays
  - d_items
  - chartevents
