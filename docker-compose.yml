# Local stack: PostgreSQL 16 + pipeline runner + Streamlit dashboard.
#   docker compose up -d db
#   docker compose run --rm pipeline          # download demo, ingest, dbt build, analytics, tests
#   docker compose up -d dashboard            # http://localhost:8501
# NOTE: written for portability but not executed in the original build environment
# (Docker was unavailable there); see PROGRESS.md.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hi_admin
      POSTGRES_PASSWORD: ${HI_PG_PASSWORD:-hi_local_only}
      POSTGRES_DB: hospital_intel
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "work_mem=64MB"]
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hi_admin -d hospital_intel"]
      interval: 5s
      timeout: 5s
      retries: 20

  pipeline:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment: &app_env
      HI_PG_HOST: db
      HI_PG_PORT: "5432"
      HI_PG_USER: hi_admin
      HI_PG_PASSWORD: ${HI_PG_PASSWORD:-hi_local_only}
      HI_PG_DB: hospital_intel
      HI_DATASET_MODE: ${HI_DATASET_MODE:-demo}
      PYTHON: python
      DBT: dbt
    volumes:
      - ./data:/app/data          # downloaded/credentialed data stays on the host
      - ./reports:/app/reports
      - ./docs:/app/docs
    command: ["bash", "scripts/run_pipeline.sh"]
    profiles: ["pipeline"]

  dashboard:
    build: .
    depends_on:
      db: {condition: service_healthy}
    environment: *app_env
    ports: ["8501:8501"]
    command: ["python", "-m", "streamlit", "run", "dashboard/streamlit/app.py",
              "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true"]

volumes:
  pgdata:
